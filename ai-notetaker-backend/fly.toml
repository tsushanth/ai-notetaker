app = "ai-notetaker-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Log only until the server can check Google Play purchases (GOOGLE_PLAY_SERVICE_ACCOUNT_JSON): without it, enforcing
  # would hold every new Android purchase as pending. Remove this line to enforce, once that key is set AND the app
  # release that sends the purchase token is out (see src/utils/subscriptionTrust.js).
  SUBSCRIPTION_VERIFY_MODE = "log"
  # YouTube videos without captions: let Supadata write the transcript (limits in src/services/transcriptGeneration.js:
  # 20 minute videos, 3 per user per day, 3,000 credits a month). Kill switch: set to "false" and deploy.
  YOUTUBE_GENERATE_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[deploy]
  strategy = "rolling"
